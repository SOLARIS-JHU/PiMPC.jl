<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d">
<title id="t">Construction-free πMPC</title><desc id="d">Standard MPC couples input and state gradient solves into an N-growing KKT system. πMPC defines v_k equal to B-bar times delta-u_k, decoupling local updates into fixed-size cached inverses.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0071e3"/></marker><style><![CDATA[
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1d1d1f}.title{font-size:36px;font-weight:750;text-anchor:middle}.sub{font-size:18px;fill:#6e6e73;text-anchor:middle}.eyebrow{font-size:14px;font-weight:750;letter-spacing:1.2px;text-anchor:middle}.red{fill:#b54848}.blue{fill:#0071e3}.panel{fill:#fff;stroke:#d2d2d7;stroke-width:1.2}.badpanel{fill:#fffafa;stroke:#e5b2b2;stroke-width:1.3}.goodpanel{fill:#fff;stroke:#b9d6f4;stroke-width:1.3}.head{font-size:20px;font-weight:750;text-anchor:middle}.body{font-size:15px;fill:#6e6e73;text-anchor:middle}.eq{font-family:Cambria Math,Georgia,serif;font-size:18px;text-anchor:middle}.seq{font-family:Cambria Math,Georgia,serif;font-size:15px;text-anchor:middle}.bad{fill:#fff0f0;stroke:#e9b4b4;stroke-width:1.1}.good{fill:#edf6ff;stroke:#9cc9f4;stroke-width:1.1}.operator{fill:#fff;stroke:#a8c9e8;stroke-width:1.2}.opname{font-size:20px;font-weight:800;text-anchor:middle;fill:#0071e3}.opeq{font-family:Cambria Math,Georgia,serif;font-size:15px;text-anchor:middle}.opnote{font-size:13px;text-anchor:middle;fill:#6e6e73}.tag{fill:#0071e3}.tagt{font-size:11px;font-weight:750;text-anchor:middle;fill:#fff}.inverse{fill:#fff}.arrow{fill:none;stroke:#0071e3;stroke-width:2;marker-end:url(#a)}.result{fill:#eaf4ff;stroke:#8fc4f8;stroke-width:1.3}.resulttext{font-size:18px;font-weight:750;text-anchor:middle;fill:#075db5}
]]></style></defs>
<rect width="1600" height="720" fill="#ffffff"/>
<text x="800" y="54" class="title">Construction-free by design.</text><text x="800" y="82" class="sub">Absorb the input effect into a local copy, and the horizon-sized solve disappears.</text>
<rect x="70" y="122" width="440" height="440" rx="14" class="badpanel"/><text x="290" y="156" class="eyebrow red">STANDARD MPC / ADMM</text><text x="290" y="190" class="head">The dynamics penalty couples both gradients.</text>
<rect x="100" y="214" width="380" height="56" rx="8" class="bad"/><text x="290" y="248" class="eq">½ρ‖x̄ₖ₊₁−Āₖx̄ₖ−B̄ₖΔuₖ−ēₖ‖²</text><text x="290" y="294" class="body">B̄ₖΔuₖ appears in both gradient conditions.</text>
<rect x="100" y="318" width="380" height="54" rx="8" class="bad"/><text x="290" y="342" class="seq">(Wᵈᵘ+ρB̄ᵀB̄)Δuₖ = … x̄ₖ₊₁ …</text><text x="290" y="362" class="body">Δuₖ depends on x̄ₖ₊₁</text>
<rect x="100" y="384" width="380" height="54" rx="8" class="bad"/><text x="290" y="408" class="seq">(Q̄+ρI+ρĀᵀĀ)x̄ₖ₊₁ = … B̄Δuₖ</text><text x="290" y="428" class="body">x̄ₖ₊₁ depends on Δuₖ</text>
<rect x="100" y="464" width="380" height="76" rx="10" class="bad"/><text x="290" y="492" class="head">One coupled KKT system</text><text x="290" y="517" class="body">Size grows with horizon: N · nₓ × N · nₓ</text><text x="290" y="537" class="body">Assemble + factor at every MPC step</text>
<path d="M530 340H650" class="arrow"/><text x="590" y="310" class="eyebrow blue">THE SPLIT</text><rect x="530" y="326" width="120" height="44" rx="22" fill="#0071e3"/><text x="590" y="354" class="eq inverse">vₖ=B̄ₖΔuₖ</text><text x="590" y="396" class="body">copy the input effect</text>
<rect x="670" y="122" width="860" height="440" rx="14" class="goodpanel"/><text x="1100" y="156" class="eyebrow blue">πMPC</text><text x="1100" y="190" class="head">The split makes local gradient solves independent.</text><text x="1100" y="218" class="body">B̄ₖ lives with Δuₖ; the dynamics term uses the frozen copy vₖ.</text>
<rect x="704" y="242" width="248" height="86" rx="10" class="good"/><text x="828" y="269" class="head">Input update</text><text x="828" y="295" class="seq">(Wᵈᵘ+ρB̄ᵀB̄)Δuₖ=ρB̄ᵀ(v̂ₖ−β̂ₖ)</text><text x="828" y="316" class="body">x̄ absent · nᵤ × nᵤ</text>
<rect x="992" y="242" width="248" height="86" rx="10" class="good"/><text x="1116" y="269" class="head">State update</text><text x="1116" y="295" class="seq">(Q̄+ρI+ρĀᵀĀ)x̄ₖ₊₁=hₖ</text><text x="1116" y="316" class="body">Δu absent · (nₓ+nᵤ)²</text>
<rect x="1280" y="242" width="216" height="86" rx="10" class="good"/><text x="1388" y="269" class="head">Dynamics copy</text><text x="1388" y="295" class="seq">zₖ₊₁=Āₖx̄ₖ+vₖ+ēₖ</text><text x="1388" y="316" class="body">B̄ absent</text>
<text x="1100" y="366" class="head">Cache compact operators once.</text>
<g transform="translate(704 392)"><rect width="242" height="126" rx="10" class="operator"/><rect x="186" y="12" width="44" height="20" rx="10" class="tag"/><text x="208" y="26" class="tagt">once</text><text x="121" y="40" class="opname">Jₖ</text><text x="121" y="67" class="opeq">(Wᵈᵘ+ρB̄ᵀB̄)⁻¹B̄ᵀ</text><text x="121" y="92" class="opnote">Δuₖ=Jₖ(v̂ₖ−β̂ₖ)</text><text x="121" y="113" class="opnote">fixed size, independent of N</text></g>
<g transform="translate(980 392)"><rect width="242" height="126" rx="10" class="operator"/><rect x="186" y="12" width="44" height="20" rx="10" class="tag"/><text x="208" y="26" class="tagt">once</text><text x="121" y="40" class="opname">H_A</text><text x="121" y="67" class="opeq">(Q̄+ρI+ρĀᵀĀ)⁻¹</text><text x="121" y="92" class="opnote">x̄ₖ₊₁=H_Ahₖ</text><text x="121" y="113" class="opnote">interior-stage operator</text></g>
<g transform="translate(1256 392)"><rect width="242" height="126" rx="10" class="operator"/><rect x="186" y="12" width="44" height="20" rx="10" class="tag"/><text x="208" y="26" class="tagt">once</text><text x="121" y="40" class="opname">H_AN</text><text x="121" y="67" class="opeq">(Q̄+ρI)⁻¹</text><text x="121" y="92" class="opnote">x̄_N=H_ANh_N</text><text x="121" y="113" class="opnote">terminal-stage operator</text></g>
<rect x="180" y="626" width="1240" height="56" rx="12" class="result"/><text x="800" y="660" class="resulttext">vₖ=B̄ₖΔuₖ absorbs B̄ → independent local solves → no N-growing matrix is assembled or factored.</text>
</svg>
